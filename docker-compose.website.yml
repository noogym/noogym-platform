services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noogym_leads}
      POSTGRES_USER: ${POSTGRES_USER:-noogym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noogym}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-noogym} -d ${POSTGRES_DB:-noogym_leads}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  leads-api:
    build:
      context: .
      dockerfile: apps/leads-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3333"
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://noogym:noogym@postgres:5432/noogym_leads?schema=public}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-this-long-random-secret}
      AUTH_TURNSTILE_REQUIRED: ${AUTH_TURNSTILE_REQUIRED:-false}
      LEADS_TURNSTILE_REQUIRED: ${LEADS_TURNSTILE_REQUIRED:-false}
      WHATSAPP_PHONE_NUMBER: ${WHATSAPP_PHONE_NUMBER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-auto}
      MAIL_FROM: ${MAIL_FROM:-Noogym <no-reply@noogym.com>}
      MAIL_TO: ${MAIL_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_ENDPOINT: ${RESEND_ENDPOINT:-https://api.resend.com/emails}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      EMAIL_SITE_URL: ${EMAIL_SITE_URL:-https://noogym.com}
      EMAIL_SUPPORT_URL: ${EMAIL_SUPPORT_URL:-https://noogym.com/suporte}
      EMAIL_PRIVACY_URL: ${EMAIL_PRIVACY_URL:-https://noogym.com/privacidade}
      EMAIL_TERMS_URL: ${EMAIL_TERMS_URL:-https://noogym.com/termos}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3333:3333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3333/docs').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      leads-api:
        condition: service_healthy
    environment:
      SERVICE_URL_WEB_3000: ${SERVICE_URL_WEB_3000:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://leads-api:3333
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      leads-api:
        condition: service_healthy
    environment:
      SERVICE_URL_NOOGYM_OFICIAL_3000: ${SERVICE_URL_NOOGYM_OFICIAL_3000:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://leads-api:3333
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "3001:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
