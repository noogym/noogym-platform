services:
  postgres:
    image: "postgres:16-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-noogymsoftware}"
      POSTGRES_USER: "${POSTGRES_USER:-noogym}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-noogym_password}"
    expose:
      - "5432"
    volumes:
      - "noogym_postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - "noogym_redis_data:/data"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: noogym-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_PROVIDER: "${AUTH_PROVIDER:-local}"
      PORT: 3333
      DATABASE_URL: "${DATABASE_URL:-postgresql://noogym:noogym_password@postgres:5432/noogymsoftware?schema=public}"
      DATABASE_RETRY_DELAY_MS: "${DATABASE_RETRY_DELAY_MS:-2000}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-before-production-please}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1d}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-this-refresh-secret-before-production-please}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-noogym.startup@gmail.com}"
      SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-Noogym Startup}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      SUPER_ADMIN_ROTATE_PASSWORD: "${SUPER_ADMIN_ROTATE_PASSWORD:-false}"
      PASSWORD_RESET_BASE_URL: "${PASSWORD_RESET_BASE_URL:-https://admin.noogym.com}"
      PASSWORD_RESET_TTL_MINUTES: "${PASSWORD_RESET_TTL_MINUTES:-30}"
      PASSWORD_RESET_EXPOSE_TOKEN: "${PASSWORD_RESET_EXPOSE_TOKEN:-false}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-auto}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM: "${RESEND_FROM:-Noogym <noreply@noogym.com>}"
      EMAIL_LOGO_URL: "${EMAIL_LOGO_URL:-}"
      EMAIL_SITE_URL: "${EMAIL_SITE_URL:-https://noogym.com}"
      EMAIL_SUPPORT_URL: "${EMAIL_SUPPORT_URL:-https://noogym.com/suporte}"
      EMAIL_PRIVACY_URL: "${EMAIL_PRIVACY_URL:-https://noogym.com/privacidade}"
      EMAIL_TERMS_URL: "${EMAIL_TERMS_URL:-https://noogym.com/termos}"
      EMAIL_QUEUE_ENABLED: "${EMAIL_QUEUE_ENABLED:-true}"
      EMAIL_QUEUE_REQUIRED: "${EMAIL_QUEUE_REQUIRED:-false}"
      EMAIL_WORKER_ENABLED: "${EMAIL_WORKER_ENABLED:-true}"
      EMAIL_WORKER_CONCURRENCY: "${EMAIL_WORKER_CONCURRENCY:-5}"
      EMAIL_MAX_ATTEMPTS: "${EMAIL_MAX_ATTEMPTS:-5}"
      EMAIL_RETRY_DELAY_MS: "${EMAIL_RETRY_DELAY_MS:-60000}"
      EMAIL_RECOVERY_INTERVAL_MS: "${EMAIL_RECOVERY_INTERVAL_MS:-60000}"
      EMAIL_RECOVERY_BATCH_SIZE: "${EMAIL_RECOVERY_BATCH_SIZE:-100}"
      BACKGROUND_JOBS_ENABLED: "${BACKGROUND_JOBS_ENABLED:-true}"
      BACKGROUND_JOBS_REQUIRED: "${BACKGROUND_JOBS_REQUIRED:-false}"
      BACKGROUND_WORKER_ENABLED: "${BACKGROUND_WORKER_ENABLED:-true}"
      BACKGROUND_WORKER_CONCURRENCY: "${BACKGROUND_WORKER_CONCURRENCY:-5}"
      BACKGROUND_MAX_ATTEMPTS: "${BACKGROUND_MAX_ATTEMPTS:-5}"
      BACKGROUND_RETRY_DELAY_MS: "${BACKGROUND_RETRY_DELAY_MS:-60000}"
      BACKGROUND_RECOVERY_INTERVAL_MS: "${BACKGROUND_RECOVERY_INTERVAL_MS:-60000}"
      BACKGROUND_RECOVERY_BATCH_SIZE: "${BACKGROUND_RECOVERY_BATCH_SIZE:-200}"
      BACKGROUND_SCHEDULER_INTERVAL_MS: "${BACKGROUND_SCHEDULER_INTERVAL_MS:-900000}"
      BACKGROUND_RECURRING_ENABLED: "${BACKGROUND_RECURRING_ENABLED:-true}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Noogym <noreply@noogym.com>}"
      # 🔥 CORRIGIDO: Agora aceita requisições vindas do admin.noogym.com (Mata o erro de CORS)
      CORS_ORIGINS: "${CORS_ORIGINS:-https://admin.noogym.com}"
      THROTTLE_TTL_MS: "${THROTTLE_TTL_MS:-60000}"
      THROTTLE_LIMIT: "${THROTTLE_LIMIT:-120}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SUPER_ADMIN_BOOTSTRAP: "${RUN_SUPER_ADMIN_BOOTSTRAP:-false}"
    expose:
      - "3333"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:3333/health/live',res=>{process.exit(res.statusCode<500?0:1)}).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  web-admin:
    build:
      context: .
      dockerfile: apps/erp/Dockerfile
      # 🔥 CORRIGIDO: Injeta a URL correta da API no processo de compilação do Next.js
      args:
        NEXT_PUBLIC_NOOGYM_API_URL: "${NEXT_PUBLIC_NOOGYM_API_URL:-https://apiv1.noogym.com}"
        NEXT_PUBLIC_NOOGYM_HTTP_ONLY_AUTH: "${NEXT_PUBLIC_NOOGYM_HTTP_ONLY_AUTH:-true}"
    image: noogym-erp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NOOGYM_API_URL: "${NOOGYM_API_URL:-https://apiv1.noogym.com}"
      NEXT_PUBLIC_NOOGYM_API_URL: "${NEXT_PUBLIC_NOOGYM_API_URL:-https://apiv1.noogym.com}"
      NEXT_PUBLIC_NOOGYM_HTTP_ONLY_AUTH: "${NEXT_PUBLIC_NOOGYM_HTTP_ONLY_AUTH:-true}"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/',res=>{process.exit(res.statusCode<500?0:1)}).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  leads-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noogym_leads
      POSTGRES_USER: noogym
      POSTGRES_PASSWORD: "${LEADS_POSTGRES_PASSWORD:-noogym_password}"
    volumes:
      - noogym_leads_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U noogym -d noogym_leads"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  leads-api:
    build:
      context: .
      dockerfile: apps/leads-api/Dockerfile
    image: noogym-leads-api
    restart: unless-stopped
    depends_on:
      leads-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: "postgresql://noogym:${LEADS_POSTGRES_PASSWORD:-noogym_password}@leads-postgres:5432/noogym_leads?schema=public"
      WEB_ORIGIN: "${LEADS_WEB_ORIGIN:-http://localhost:3001}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-change-me}"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET:-change-this-long-random-secret}"
      AUTH_TURNSTILE_REQUIRED: "${AUTH_TURNSTILE_REQUIRED:-false}"
      LEADS_TURNSTILE_REQUIRED: "${LEADS_TURNSTILE_REQUIRED:-false}"
      WHATSAPP_PHONE_NUMBER: "${WHATSAPP_PHONE_NUMBER:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-auto}"
      MAIL_FROM: "${MAIL_FROM:-Noogym <no-reply@noogym.com>}"
      MAIL_TO: "${MAIL_TO:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM: "${RESEND_FROM:-}"
      RESEND_ENDPOINT: "${RESEND_ENDPOINT:-https://api.resend.com/emails}"
      EMAIL_LOGO_URL: "${EMAIL_LOGO_URL:-}"
      EMAIL_SITE_URL: "${EMAIL_SITE_URL:-https://noogym.com}"
      EMAIL_SUPPORT_URL: "${EMAIL_SUPPORT_URL:-https://noogym.com/suporte}"
      EMAIL_PRIVACY_URL: "${EMAIL_PRIVACY_URL:-https://noogym.com/privacidade}"
      EMAIL_TERMS_URL: "${EMAIL_TERMS_URL:-https://noogym.com/termos}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
    image: noogym-website
    restart: unless-stopped
    depends_on:
      leads-api:
        condition: service_healthy
      intelligence-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://leads-api:3333
      INTELLIGENCE_API_URL: http://intelligence-api:3340
      INTELLIGENCE_API_KEY: "${INTELLIGENCE_API_KEY:-dev-intelligence-key}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_DEMO_MODE: "${NEXT_PUBLIC_DEMO_MODE:-false}"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
    image: noogym-marketing
    restart: unless-stopped
    depends_on:
      leads-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://leads-api:3333
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  intelligence-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noogym_intelligence
      POSTGRES_USER: noogym
      POSTGRES_PASSWORD: "${INTELLIGENCE_POSTGRES_PASSWORD:-noogym_password}"
    volumes:
      - noogym_intelligence_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U noogym -d noogym_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  intelligence-api:
    build:
      context: .
      dockerfile: apps/intelligence-api/Dockerfile
    image: noogym-intelligence-api
    restart: unless-stopped
    depends_on:
      intelligence-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3340
      DATABASE_URL: "postgresql://noogym:${INTELLIGENCE_POSTGRES_PASSWORD:-noogym_password}@intelligence-postgres:5432/noogym_intelligence?schema=public"
      WEB_ORIGIN: "${INTELLIGENCE_WEB_ORIGIN:-http://localhost:3003}"
      INTELLIGENCE_API_KEY: "${INTELLIGENCE_API_KEY:-dev-intelligence-key}"
      INTELLIGENCE_SUBMISSION_API_KEY: "${INTELLIGENCE_SUBMISSION_API_KEY:-dev-submission-key}"
      NOOGYM_INTELLIGENCE_USER_AGENT: "${NOOGYM_INTELLIGENCE_USER_AGENT:-NoogymFitnessIntelligence/0.1 (+https://noogym.com)}"
      CRAWLER_TIMEOUT_MS: "${CRAWLER_TIMEOUT_MS:-8000}"
      CRAWLER_DELAY_MS: "${CRAWLER_DELAY_MS:-1500}"
      AI_PROVIDER: "${AI_PROVIDER:-disabled}"
      WEBSITE_PUBLISHING_URL: http://website:3000/api
      WEBSITE_DATA_EXPORT_DIR: ../website/src/data/generated
    expose:
      - "3340"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3340/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  intelligence-web:
    build:
      context: .
      dockerfile: apps/intelligence-web/Dockerfile
    image: noogym-intelligence-web
    restart: unless-stopped
    depends_on:
      intelligence-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      INTELLIGENCE_API_URL: http://intelligence-api:3340
      INTELLIGENCE_API_KEY: "${INTELLIGENCE_API_KEY:-dev-intelligence-key}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  noogym_postgres_data: null
  noogym_redis_data: null
  noogym_leads_postgres_data: null
  noogym_intelligence_postgres_data: null
