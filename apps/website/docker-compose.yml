services:
  website:
    build:
      context: ../..
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: website
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://host.docker.internal:3333}
      INTELLIGENCE_API_URL: ${INTELLIGENCE_API_URL:-http://host.docker.internal:3340}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-dev-intelligence-key}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
