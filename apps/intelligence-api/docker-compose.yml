name: noogym-intelligence-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noogym_intelligence
      POSTGRES_USER: noogym
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-noogym_password}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - intelligence_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U noogym -d noogym_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  intelligence-api:
    build:
      context: ../..
      dockerfile: apps/intelligence-api/Dockerfile
    image: noogym-intelligence-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3340
      DATABASE_URL: "postgresql://noogym:${POSTGRES_PASSWORD:-noogym_password}@postgres:5432/noogym_intelligence?schema=public"
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:3003}"
      INTELLIGENCE_API_KEY: "${INTELLIGENCE_API_KEY:-dev-intelligence-key}"
    ports:
      - "${API_PORT:-3340}:3340"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3340/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  intelligence_postgres_data:
